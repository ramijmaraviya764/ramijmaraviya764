name: Update README Cards

# WHY THIS EXISTS:
# The public https://github-readme-stats.vercel.app service is a free,
# community-run instance and is officially documented by its maintainers
# as "best-effort" — it goes down or rate-limits often. Instead of loading
# your stats live from that service every time someone opens your profile,
# this workflow generates the cards ONCE as static SVG files and commits
# them straight into this repository. Your README then just displays those
# files, so your profile never shows a broken image again.

on:
  schedule:
    - cron: "0 3 * * *"   # regenerates once a day at 03:00 UTC
  workflow_dispatch: {}    # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=github_dark&hide_border=true&bg_color=0d1117&title_color=00FF41&icon_color=00FF41&text_color=c9d1d9&ring_color=00FF41&include_all_commits=true"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=github_dark&hide_border=true&bg_color=0d1117&title_color=00FF41&text_color=c9d1d9"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README stats cards" || echo "No changes to commit"
          git push
